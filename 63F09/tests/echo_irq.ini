; Echo of the keyboard on ACIA0, driven by the receive interrupt (EIRQ23).  Run from the root of the tree:  BIN/m63f09 63F09/tests/echo_irq.ini
; Type text: it comes back.  'q' ends the program ; Ctrl-E returns to the prompt (then: quit).
; Rebuild the ELF after a change of echo_irq.s:
;   as-new -m63f09 echo_irq.s -o echo_irq.o && ld-new -m m6809soc echo_irq.o -o echo_irq.elf
load 63F09/tests/echo_irq.elf
reset
go
