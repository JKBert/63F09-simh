; M0: load an ELF of the toolchain, reset by the vector, disassemble.  Run from the root of the tree: BIN/m63f09 63F09/tests/m0.ini
; Rebuild the ELF after a change of m0.s:
;   as-new -m63f09 m0.s -o m0.o && ld-new -m m6809soc m0.o -o m0.elf
load 63F09/tests/m0.elf
boot cpu
set cpu disasm=63f09
examine -m fffff0000-fffff0023
examine -c fffff0024-fffff0028
